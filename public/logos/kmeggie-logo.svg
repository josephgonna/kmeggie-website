<svg viewBox="0 0 1500 580" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Kmeggie+ logo</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,400&amp;display=swap');
    </style>
  </defs>
  <rect width="1500" height="580" fill="#FFFFFF"/>

  <!-- hexagon -->
  <polygon points="290,70 90.8,185 90.8,415 290,530 489.2,415 489.2,185"
           fill="#0D3B33"/>

  <!-- DNA flask strands -->
  <path d="M 250,140 C 210,180 245,230 288,298 C 245,365 205,415 245,455"
        fill="none" stroke="#E8B15C" stroke-width="17" stroke-linecap="round"/>
  <path d="M 355,150 C 385,190 345,235 292,298 C 345,362 390,410 350,452"
        fill="none" stroke="#E8896C" stroke-width="17" stroke-linecap="round"/>

  <!-- rungs -->
  <line x1="222" y1="190" x2="358" y2="190" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <line x1="257" y1="290" x2="323" y2="290" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <line x1="215" y1="392" x2="365" y2="392" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>

  <!-- loose-end dots -->
  <circle cx="345" cy="92" r="11" fill="#E8B15C"/>
  <circle cx="374" cy="113" r="7" fill="#E8896C"/>

  <!-- wordmark -->
  <text x="640" y="325" font-family="'Fraunces','Georgia',serif" font-weight="600" font-size="146" letter-spacing="-2" fill="#2B2B28">Kmeggie<tspan fill="#8C5A22">+</tspan></text>

  <!-- motto -->
  <text x="644" y="410" font-family="'Fraunces','Georgia',serif" font-weight="400" font-style="italic" font-size="42" letter-spacing="3" fill="#6B6B6B">Veritas</text>
</svg>
