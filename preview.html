<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kmeggie+ — Design Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #0a0a0a;
  --panel: #121212;
  --panel-raised: #161616;
  --border: #2a2a2a;
  --border-soft: #1f1f1f;
  --text: #e8e6e1;
  --text-dim: #9a9992;
  --text-faint: #5f5e58;
  --teal: #4fd1c5;
  --teal-dim: #2d7c74;
  --pass: #4fd18a;
  --warn: #e0b34d;
  --fail: #e0654d;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --sans: 'Inter', system-ui, -apple-system, sans-serif;
  --radius: 3px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
}

body {
  min-height: 100vh;
}

#app {
  max-width: 1040px;
  margin: 0 auto;
  padding: 0 24px 96px;
}

a { color: var(--teal); }

/* ---------- Header ---------- */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 0 24px;
  border-bottom: 1px solid var(--border-soft);
  margin-bottom: 40px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}

.brand-name {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.01em;
}

.brand-name .plus { color: var(--teal); }

.header-sub {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-faint);
}

/* ---------- Hero / intro ---------- */

.intro {
  margin-bottom: 32px;
}

.intro h1 {
  font-size: 26px;
  font-weight: 600;
  line-height: 1.3;
  margin: 0 0 8px;
  max-width: 34ch;
}

.intro p {
  color: var(--text-dim);
  font-size: 14px;
  line-height: 1.6;
  max-width: 58ch;
  margin: 0;
}

/* ---------- Dropzone ---------- */

.dropzone {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 48px 24px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}

.dropzone:hover,
.dropzone:focus-visible {
  border-color: var(--teal-dim);
  outline: none;
}

.dropzone.drag-active {
  border-color: var(--teal);
  background: var(--panel-raised);
}

.dropzone-icon {
  color: var(--text-faint);
  margin-bottom: 14px;
}

.dropzone-title {
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 4px;
}

.dropzone-sub {
  font-size: 12px;
  color: var(--text-faint);
  font-family: var(--mono);
}

.dropzone input[type="file"] {
  display: none;
}

/* ---------- Processing state ---------- */

.processing {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 40px 24px;
  text-align: center;
}

.processing-label {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-dim);
}

.spinner {
  width: 18px;
  height: 18px;
  border: 2px solid var(--border);
  border-top-color: var(--teal);
  border-radius: 50%;
  margin: 0 auto 16px;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ---------- Error state ---------- */

.error-panel {
  border: 1px solid var(--fail);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 20px 22px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.error-panel strong {
  display: block;
  font-size: 13px;
  margin-bottom: 4px;
  color: var(--fail);
}

.error-panel p {
  margin: 0;
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.5;
}

.error-panel button {
  margin-top: 12px;
}

/* ---------- Results ---------- */

.results {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.result-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding: 16px 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
}

.result-filename {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text);
  word-break: break-all;
}

.result-meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-faint);
  margin-top: 3px;
}

/* Status badge */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.04em;
  padding: 4px 10px;
  border-radius: var(--radius);
  border: 1px solid;
  line-height: 1.4;
}

.badge-PASS { color: var(--pass); border-color: var(--pass); }
.badge-WARN { color: var(--warn); border-color: var(--warn); }
.badge-FAIL { color: var(--fail); border-color: var(--fail); }

/* Panel */

.panel {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
  overflow: hidden;
}

.panel-title {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-dim);
  padding: 14px 20px;
  border-bottom: 1px solid var(--border-soft);
}

/* Metrics table */

table.metrics {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

table.metrics th {
  text-align: left;
  font-weight: 500;
  font-size: 11px;
  color: var(--text-faint);
  padding: 10px 20px;
  border-bottom: 1px solid var(--border-soft);
}

table.metrics td {
  padding: 11px 20px;
  border-bottom: 1px solid var(--border-soft);
  vertical-align: middle;
}

table.metrics tr:last-child td {
  border-bottom: none;
}

table.metrics td.metric-name {
  color: var(--text-dim);
}

table.metrics td.metric-value {
  font-family: var(--mono);
  color: var(--text);
}

/* Per-base quality chart */

.chart-wrap {
  padding: 18px 20px 20px;
}

.chart-wrap svg {
  width: 100%;
  height: auto;
  display: block;
}

.chart-legend {
  display: flex;
  gap: 18px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-faint);
  margin-top: 10px;
}

.chart-legend span::before {
  content: '';
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 1px;
  margin-right: 6px;
  vertical-align: middle;
}

.legend-pass::before { background: var(--pass); }
.legend-warn::before { background: var(--warn); }
.legend-fail::before { background: var(--fail); }

/* Overrepresented sequences */

.seq-mono {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text);
}

.empty-note {
  padding: 16px 20px;
  font-size: 12px;
  color: var(--text-faint);
}

/* Actions */

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

button {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  padding: 9px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease;
}

button:hover { border-color: var(--teal-dim); color: var(--teal); }

button.primary {
  background: var(--teal);
  border-color: var(--teal);
  color: #08201e;
}

button.primary:hover {
  background: #63dccf;
  color: #08201e;
}

/* Footer */

.footer {
  margin-top: 56px;
  padding-top: 20px;
  border-top: 1px solid var(--border-soft);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-faint);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}

@media (max-width: 560px) {
  #app { padding: 0 16px 64px; }
  .intro h1 { font-size: 22px; }
  table.metrics th:nth-child(3),
  table.metrics td:nth-child(3) { text-align: right; }
}

.preview-note {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-faint);
  border: 1px dashed var(--border);
  padding: 10px 14px;
  border-radius: var(--radius);
  margin-bottom: 24px;
}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [key, val] of Object.entries(attrs)) {
    if (key === 'class') node.className = val;
    else if (key === 'html') node.innerHTML = val;
    else node.setAttribute(key, val);
  }
  for (const child of [].concat(children)) {
    if (child) node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
  }
  return node;
}

function header() {
  return el('div', { class: 'header' }, [
    el('div', { class: 'brand' }, [
      el('div', {
        class: 'brand-mark', html: `
        <svg viewBox="0 0 64 64" width="22" height="22">
          <polygon points="32,3 58,17.5 58,46.5 32,61 6,46.5 6,17.5" fill="#0F3D3E"/>
          <path d="M22 14 C22 24, 42 24, 42 34 C42 44, 22 44, 22 50" fill="none" stroke="#4FD1C5" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M42 14 C42 24, 22 24, 22 34 C22 44, 42 44, 42 50" fill="none" stroke="#4FD1C5" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
        </svg>`
      }),
      el('div', { class: 'brand-name' }, ['Kmeggie', el('span', { class: 'plus' }, '+')])
    ]),
    el('div', { class: 'header-sub' }, 'FASTQ QC \u2014 runs locally in your browser')
  ]);
}

function footer() {
  return el('div', { class: 'footer' }, [
    el('span', {}, 'Kmeggie+ \u00b7 Veritas AI'),
    el('span', {}, 'Processing happens on-device \u2014 files are never uploaded')
  ]);
}

function statusBadge(status) {
  return el('span', { class: `badge badge-${status}` }, status);
}

function metricsTable(report) {
  const rows = report.metrics.map((m) =>
    el('tr', {}, [
      el('td', { class: 'metric-name' }, m.label),
      el('td', { class: 'metric-value' }, m.value),
      el('td', {}, statusBadge(m.status))
    ])
  );
  return el('table', { class: 'metrics' }, [
    el('thead', {}, el('tr', {}, [
      el('th', {}, 'Metric'), el('th', {}, 'Value'), el('th', {}, 'Status')
    ])),
    el('tbody', {}, rows)
  ]);
}

function perBaseChart(report) {
  const points = report.perBaseQuality;
  const w = 960, h = 220, padL = 34, padR = 12, padT = 12, padB = 24;
  const maxQ = Math.max(41, Math.ceil(Math.max(...points.map((p) => p.meanQuality)) + 2));
  const xFor = (i) => padL + (i / (points.length - 1 || 1)) * (w - padL - padR);
  const yFor = (q) => padT + (1 - q / maxQ) * (h - padT - padB);
  const bandColor = (q) => (q >= 30 ? 'var(--pass)' : q >= 20 ? 'var(--warn)' : 'var(--fail)');

  let path = '';
  points.forEach((p, i) => {
    const x = xFor(i).toFixed(1);
    const y = yFor(p.meanQuality).toFixed(1);
    path += (i === 0 ? 'M' : 'L') + x + ',' + y + ' ';
  });

  const dots = points
    .filter((_, i) => i % Math.max(1, Math.floor(points.length / 60)) === 0)
    .map((p) => {
      const i = points.indexOf(p);
      return `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(p.meanQuality).toFixed(1)}" r="2" fill="${bandColor(p.meanQuality)}" />`;
    })
    .join('');

  const gridLines = [40, 30, 20, 10, 0]
    .filter((q) => q <= maxQ)
    .map((q) => {
      const y = yFor(q).toFixed(1);
      return `<line x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}" stroke="var(--border-soft)" stroke-width="1"/>
              <text x="${padL - 8}" y="${y}" fill="var(--text-faint)" font-size="10" font-family="var(--mono)" text-anchor="end" dominant-baseline="middle">${q}</text>`;
    })
    .join('');

  const xLabelEvery = Math.max(1, Math.round(points.length / 8));
  const xLabels = points
    .filter((p, i) => i % xLabelEvery === 0)
    .map((p) => {
      const i = points.indexOf(p);
      return `<text x="${xFor(i).toFixed(1)}" y="${h - 6}" fill="var(--text-faint)" font-size="10" font-family="var(--mono)" text-anchor="middle">${p.position}</text>`;
    })
    .join('');

  const svg = `
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
      ${gridLines}
      <path d="${path}" fill="none" stroke="var(--teal)" stroke-width="1.5" />
      ${dots}
      ${xLabels}
    </svg>`;

  const wrap = el('div', { class: 'chart-wrap' });
  wrap.innerHTML = svg;
  wrap.appendChild(el('div', { class: 'chart-legend' }, [
    el('span', { class: 'legend-pass' }, '\u2265 Q30'),
    el('span', { class: 'legend-warn' }, 'Q20\u2013Q29'),
    el('span', { class: 'legend-fail' }, '< Q20')
  ]));
  return wrap;
}

function overrepresentedPanel(report) {
  const rows = report.overrepresented.map((o) =>
    el('tr', {}, [
      el('td', { class: 'seq-mono' }, o.sequence),
      el('td', { class: 'metric-value' }, o.count.toLocaleString()),
      el('td', { class: 'metric-value' }, `${o.pct.toFixed(2)}%`)
    ])
  );
  return el('div', { class: 'panel' }, [
    el('div', { class: 'panel-title' }, 'Overrepresented sequences'),
    el('table', { class: 'metrics' }, [
      el('thead', {}, el('tr', {}, [
        el('th', {}, 'Sequence'), el('th', {}, 'Count'), el('th', {}, '% of sample')
      ])),
      el('tbody', {}, rows)
    ])
  ]);
}

// ---- Mock QC report (representative of a real run) ----
const mockReport = {
  filename: 'NPHL_run042_R1.fastq.gz',
  encoding: 'Phred+33 (Sanger / Illumina 1.8+)',
  overall: 'WARN',
  generatedAt: new Date().toISOString(),
  metrics: [
    { label: 'Total reads', value: '1,284,006', status: 'PASS' },
    { label: 'Total bases', value: '192,600,900', status: 'PASS' },
    { label: 'Read length (min / mean / max)', value: '35 / 150.0 / 150', status: 'PASS' },
    { label: 'GC content', value: '58.3%', status: 'WARN' },
    { label: 'Mean base quality (Phred)', value: '32.1', status: 'PASS' },
    { label: 'Bases \u2265 Q30', value: '86.4%', status: 'PASS' },
    { label: 'N content', value: '0.18%', status: 'PASS' },
    { label: 'Duplication (sampled, n=200,000)', value: '24.7%', status: 'WARN' }
  ],
  perBaseQuality: Array.from({ length: 150 }, (_, i) => ({
    position: i + 1,
    meanQuality: 37 - Math.pow(i / 150, 2.2) * 22 - (i < 5 ? (5 - i) * 0.8 : 0)
  })),
  overrepresented: [
    { sequence: 'AGATCGGAAGAGCACACGTCTGAACTCCAGTCACNNNNNNATCTCGTATGCCGTCTTCT', count: 18420, pct: 9.21 },
    { sequence: 'GATCGGAAGAGCACACGTCTGAACTCCAGTCACNNNNNNATCTCGTATGCCGTCTTCTG', count: 6110, pct: 3.06 },
    { sequence: 'CTGTCTCTTATACACATCTCCGAGCCCACGAGAC', count: 2870, pct: 1.44 }
  ]
};

const app = document.getElementById('app');
app.appendChild(header());
app.appendChild(el('div', { class: 'preview-note' }, 'Design preview \u2014 mock data, no file processing. Open the built app to run real QC.'));

const results = el('div', { class: 'results' });
results.appendChild(el('div', { class: 'result-header' }, [
  el('div', {}, [
    el('div', { class: 'result-filename' }, mockReport.filename),
    el('div', { class: 'result-meta' }, `${mockReport.encoding} \u00b7 generated ${new Date(mockReport.generatedAt).toLocaleTimeString()}`)
  ]),
  statusBadge(mockReport.overall)
]));
results.appendChild(el('div', { class: 'panel' }, [el('div', { class: 'panel-title' }, 'Metrics'), metricsTable(mockReport)]));
results.appendChild(el('div', { class: 'panel' }, [el('div', { class: 'panel-title' }, `Per-base quality (first ${mockReport.perBaseQuality.length} cycles)`), perBaseChart(mockReport)]));
results.appendChild(overrepresentedPanel(mockReport));
results.appendChild(el('div', { class: 'actions' }, [
  el('button', { class: 'primary' }, 'Download report (JSON)'),
  el('button', {}, 'Check another file')
]));

app.appendChild(results);
app.appendChild(footer());

</script>
</body>
</html>
